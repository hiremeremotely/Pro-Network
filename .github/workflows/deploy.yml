name: Deploy API → ECS Fargate

on:
  push:
    branches: [main]
    paths:
      - "artifacts/api-server/**"
      - "lib/db/**"
      - "lib/api-zod/**"
      - "deploy/ecs-task-definition.json"
      - "deploy/prepare-migration-task.mjs"
      - "deploy/check-migration-task.mjs"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api-${{ github.ref }}
  # Do not cancel a deployment while its schema transaction is running.
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, migrate RDS, deploy to ECS
    runs-on: ubuntu-latest
    timeout-minutes: 50

    permissions:
      contents: read

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. AWS credentials via access key ─────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      # ── 3. Log in to ECR ──────────────────────────────────────────────────
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ── 4. Build, verify final runtime trust, then push Docker image ──────
      - name: Build, check runtime certificates, and push Docker image
        id: build-image
        env:
          REGISTRY:   ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          SHA_TAG:    ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build \
            --platform linux/amd64 \
            -f artifacts/api-server/Dockerfile \
            --cache-from "$REGISTRY/$REPOSITORY:latest" \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            -t "$REGISTRY/$REPOSITORY:$SHA_TAG" \
            -t "$REGISTRY/$REPOSITORY:latest" \
            .
          # No env overrides, host certificate mounts, AWS access, or app startup:
          # validate the trust roots inherited by Node from the actual image.
          docker run --rm --network none --entrypoint node \
            "$REGISTRY/$REPOSITORY:$SHA_TAG" /app/check-runtime-ca.mjs
          docker push "$REGISTRY/$REPOSITORY:$SHA_TAG"
          docker push "$REGISTRY/$REPOSITORY:latest"
          echo "image=$REGISTRY/$REPOSITORY:$SHA_TAG" >> "$GITHUB_OUTPUT"

      # ── 5. Update ECS task definition with the new image ──────────────────
      - name: Inject new image into task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition:  deploy/ecs-task-definition.json
          container-name:   api-server
          image:            ${{ steps.build-image.outputs.image }}

      # ── 6. Use the service's CURRENT network configuration ───────────────
      - name: Prepare one-off migration task
        id: migration-network
        env:
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
          ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
          RENDERED_TASK: ${{ steps.task-def.outputs.task-definition }}
        run: |
          set -euo pipefail
          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            > "$RUNNER_TEMP/migration-service.json"
          node deploy/prepare-migration-task.mjs \
            "$RUNNER_TEMP/migration-service.json" "$RENDERED_TASK" \
            "$RUNNER_TEMP/migration-task.json" >> "$GITHUB_OUTPUT"

      # Register/run a separate task, WITHOUT updating the running API service.
      - name: Run RDS migrations inside ECS
        id: migrations
        env:
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
          SUBNETS: ${{ steps.migration-network.outputs.subnets }}
          SECURITY_GROUPS: ${{ steps.migration-network.outputs.security-groups }}
          ASSIGN_PUBLIC_IP: ${{ steps.migration-network.outputs.assign-public-ip }}
        run: |
          set -euo pipefail
          TASK_DEFINITION=$(aws ecs register-task-definition \
            --cli-input-json "file://$RUNNER_TEMP/migration-task.json" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          NETWORK=$(jq -cn --arg subnets "$SUBNETS" --arg groups "$SECURITY_GROUPS" \
            --arg publicIp "$ASSIGN_PUBLIC_IP" \
            '{awsvpcConfiguration: {subnets: ($subnets | split(",")), securityGroups: ($groups | split(",")), assignPublicIp: $publicIp}}')
          aws ecs run-task --cluster "$ECS_CLUSTER" \
            --task-definition "$TASK_DEFINITION" --launch-type FARGATE \
            --network-configuration "$NETWORK" --count 1 \
            > "$RUNNER_TEMP/migration-launch.json"
          if ! jq -e '(.failures | length == 0) and (.tasks | length == 1)' \
            "$RUNNER_TEMP/migration-launch.json" > /dev/null; then
            echo "ECS rejected the migration launch:"
            jq '{failures: [.failures[]? | {reason, detail}]}' "$RUNNER_TEMP/migration-launch.json"
            exit 1
          fi
          TASK_ARN=$(jq -er '.tasks[0].taskArn' "$RUNNER_TEMP/migration-launch.json")
          echo "task-arn=$TASK_ARN" >> "$GITHUB_OUTPUT"
          echo "Migration task launched: $TASK_ARN"

      - name: Confirm migration completed successfully
        env:
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
          MIGRATION_TASK_ARN: ${{ steps.migrations.outputs.task-arn }}
        run: |
          set -euo pipefail
          node deploy/check-migration-task.mjs "$ECS_CLUSTER" "$MIGRATION_TASK_ARN" \
            "$RUNNER_TEMP/migration-task.json"

      # ── 7. Only deploy after a successful migration exit ─────────────────
      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition:            ${{ steps.task-def.outputs.task-definition }}
          service:                    ${{ secrets.ECS_SERVICE }}
          cluster:                    ${{ secrets.ECS_CLUSTER }}
          wait-for-service-stability: true
